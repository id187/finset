<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fin-Set · 화면 크기별 목업</title><link rel="icon" href="./favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#e9edf4;color:#29344a;font:14px 'Malgun Gothic',sans-serif}header{min-height:72px;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #dbe1ec;background:#f9fbfe}strong{font:bold 23px Arial;letter-spacing:-1px}strong span{color:#1557ff}.tabs{display:flex;background:#eaf0f9;border-radius:9px;padding:4px;gap:4px}button{border:0;color:#8795ad;background:transparent;border-radius:7px;min-height:40px;padding:0 18px;font:12px 'Malgun Gothic',sans-serif;cursor:pointer}button.active{background:white;color:#1557ff;box-shadow:0 2px 8px #34496810}a{color:#8592a8;text-decoration:none;font-size:12px}main{height:calc(100dvh - 73px);display:flex;align-items:center;justify-content:center;padding:24px}#stage{position:relative;box-shadow:0 15px 50px #23375b1a;border-radius:12px;background:#fff;overflow:hidden;flex-shrink:0}iframe{border:0;display:block;transform-origin:top left;background:white}button:focus-visible,a:focus-visible{outline:3px solid #a0bbff;outline-offset:3px}@media(max-width:560px){header{flex-wrap:wrap;padding:12px 18px;gap:12px}header>a{display:none}.tabs{margin-left:auto}button{padding:0 10px;font-size:10px}main{padding:16px;height:calc(100dvh - 73px)}}
body{display:flex;flex-direction:column;height:100dvh}header{flex-shrink:0;flex-wrap:wrap}main{flex:1;min-height:0;height:auto!important}.screen-select{display:flex;align-items:center;gap:8px;font-size:12px;color:#74839a}.screen-select select{height:40px;border:1px solid #d9e2ee;border-radius:7px;color:#617592;background:#fff;padding:0 9px;font:12px "Malgun Gothic",sans-serif}@media(max-width:560px){.screen-select{width:100%;justify-content:center}}
</style></head><body><header><strong>Fin-Set<span>.</span></strong><div class="tabs" role="group" aria-label="화면 크기 선택"><button class="active" data-mode="web" aria-pressed="true">웹 · 1280 × 800</button><button data-mode="app" aria-pressed="false">앱 · 412 × 917</button></div><button id="start-demo" style="background:#1557ff;color:white;font-weight:bold">시연 시작 →</button><label class="screen-select">화면 <select id="screen" aria-label="목업 화면 선택"><option value="welcome">시작하기</option><option value="guided">질문형 시연</option><option value="dashboard">대시보드</option><option value="plan">저장한 계획</option><option value="setup">기존 예시 · 목표 설정</option><option value="products">기존 예시 · 상품 비교</option><option value="conditions">우대조건 질문</option><option value="recovery">회복 계획</option></select></label><a href="./" target="_blank" rel="noopener">화면 전체로 열기 ↗</a></header><main><div id="stage"><iframe src="./" title="핀셋 인터랙티브 목업" width="1280" height="800"></iframe></div></main><script>
let mode='web';const frame=document.querySelector('iframe'),stage=document.querySelector('#stage'),main=document.querySelector('main');function resize(){const [w,h]=mode==='web'?[1280,800]:[412,917];const s=Math.min(1,(main.clientWidth-48)/w,(main.clientHeight-48)/h);frame.width=w;frame.height=h;frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+s+')';stage.style.width=w*s+'px';stage.style.height=h*s+'px'}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});resize()}));document.querySelector('#screen').addEventListener('change',e=>{frame.src='./?screen='+encodeURIComponent(e.target.value)});document.querySelector('#start-demo').addEventListener('click',()=>{document.querySelector('#screen').value='guided';frame.src='./?screen=guided'});new ResizeObserver(resize).observe(main);resize();
</script></body></html>
